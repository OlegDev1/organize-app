name: Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:

permissions: { contents: write }

concurrency: { group: android, cancel-in-progress: true }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      # Same key for every build, so a new APK installs over the old one and keeps the data.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret: signed with a throwaway debug key (can't update an installed app)."
          fi

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Publish to the «android» release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk rezhim.apk
          gh release delete android --yes --cleanup-tag || true
          gh release create android rezhim.apk --title "Режим для Android" --latest \
            --notes "Сборка ${{ github.run_number }}, $(date -u +%F). Скачай rezhim.apk на телефоне и установи поверх старого."
